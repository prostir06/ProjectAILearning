name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps for XGBoost
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check diabetes run.py train.py tests

      - name: Run unit tests
        run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t diabetes-prediction:ci .

      - name: Smoke test container health
        run: |
          docker run -d --name diabetes-ci -p 5000:5000 \
            -e FLASK_SECRET_KEY=ci-test-secret \
            diabetes-prediction:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health; then
              echo ""
              docker stop diabetes-ci
              exit 0
            fi
            sleep 2
          done
          docker logs diabetes-ci
          docker stop diabetes-ci
          exit 1
