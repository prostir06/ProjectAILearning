# Docker Compose: Flask UI + API.
# Хост: http://localhost:5001  (всередині контейнера — 5000)
# Запуск: docker compose up --build
services:
  flask:
    build: .
    ports:
      - "5001:5000"
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      FLASK_DEBUG: "0"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-only-change-me}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
