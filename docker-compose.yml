# Docker Compose для локального запуску.
# Streamlit (порт 8501): docker compose up --build
# Flask (порт 5000):     docker compose --profile flask up --build
services:
  streamlit:
    build: .
    ports:
      - "8501:8501"
    restart: unless-stopped

  flask:
    build: .
    command: ["waitress-serve", "--host=0.0.0.0", "--port=5000", "app:app"]
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      FLASK_DEBUG: "0"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-only-change-me}
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    profiles:
      - flask
