[tool.mypy]
python_version = "3.12"
files = ["diabetes", "run.py", "train.py"]
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
# numpy 2.x stubs потребують 3.12 (`type` statement); runtime лишається 3.10+.
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "sklearn",
    "sklearn.*",
    "imblearn",
    "imblearn.*",
    "joblib",
    "pandas",
    "xgboost",
    "waitress",
    "flask_wtf",
    "flask_wtf.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "diabetes.core.*"
strict = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["diabetes.ml.*", "diabetes.web.*", "run", "train"]
disallow_untyped_defs = false
check_untyped_defs = false
disable_error_code = [
    "type-arg",
    "no-untyped-def",
    "no-untyped-call",
    "no-any-return",
    "union-attr",
]
